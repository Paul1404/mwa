version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      aws:
        patterns:
          - "@aws-sdk/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      orpc:
        patterns:
          - "@orpc/*"
      drizzle:
        patterns:
          - "drizzle-*"
      types:
        patterns:
          - "@types/*"
      react:
        patterns:
          - "react*"
          - "@types/react*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
    ignore:
      - dependency-name: typescript
        versions:
          - ">= 7.0.0, < 8.0.0"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "08:00"
      timezone: Europe/Berlin
